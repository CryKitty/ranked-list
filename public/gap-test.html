<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorta gap test</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b1020; color: #e2e8f0; font-family: -apple-system, system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p.sub { font-size: 12px; color: #94a3b8; margin: 0 0 12px; }
  #results { background: #111a30; border: 1px solid #26355c; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; margin-bottom: 18px; }
  .cols { display: flex; flex-wrap: wrap; gap: 18px; }
  .colwrap { width: 300px; }
  .colwrap h2 { font-size: 13px; margin: 0 0 6px; color: #fbbf24; }
  .scroll { display: flex; flex-direction: column; gap: 12px; background: #0e1526; border: 1px solid #1e293b; border-radius: 16px; padding: 10px; height: 430px; overflow-y: auto; }
  .wrap { display: flex; flex-direction: column; gap: 12px; }
  .card { height: 120px; border-radius: 14px; background: linear-gradient(135deg, #7c2d12, #dc2626); flex: none; }
  .card.b { background: linear-gradient(135deg, #164e63, #0891b2); }
  /* AddCardRow replica: base classes shared by the button and div variants */
  .row { position: relative; display: flex; width: 100%; align-items: center; justify-content: center; gap: 12px; overflow: visible; height: 16px; opacity: 0; flex: none; margin: 0; padding: 0; background: transparent; border: 0 solid; font: inherit; color: inherit; }
  .row .dot { height: 40px; width: 40px; border-radius: 9999px; background: #fff; flex: none; }
  .row .hit { position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none; }
  button.row { -webkit-appearance: button; appearance: button; }
  .fix-appear { -webkit-appearance: none !important; appearance: none !important; }
  .fix-minh0 { min-height: 0 !important; }
  .fix-maxh { max-height: 16px !important; }
</style>
</head>
<body>
<h1>Sorta card-gap test</h1>
<p class="sub">Each column should show a card-to-card gap of 40. Anything bigger is the bug. Results measured on THIS device:</p>
<div id="results">measuring…</div>
<div class="cols" id="cols"></div>

<script>
  // Build one test column. rowHTML(kind) returns the add-row element markup.
  function rowEl(kind) {
    var withDot = kind !== 'G'; // G = empty button (mobile portrait case)
    var inner = '<div class="hit"></div>' + (withDot ? '<span class="dot"></span>' : '');
    switch (kind) {
      case 'A': return '<div class="row" aria-hidden="true">' + inner + '</div>';                 // mirror-style div (control)
      case 'C': return '<button type="button" class="row">' + inner + '</button>';               // original: native button
      case 'B': return '<button type="button" class="row fix-appear">' + inner + '</button>';    // shipped fix: appearance-none
      case 'F': return '<button type="button" class="row fix-minh0">' + inner + '</button>';     // min-height:0 only
      case 'D': return '<button type="button" class="row fix-appear fix-minh0">' + inner + '</button>'; // appearance-none + min-height:0
      case 'E': return '<button type="button" class="row fix-appear fix-minh0 fix-maxh">' + inner + '</button>'; // + max-height
      case 'G': return '<button type="button" class="row fix-appear">' + inner + '</button>';    // appearance-none, empty
    }
  }
  var variants = [
    ['A', 'A — div (mirror columns today)'],
    ['C', 'C — button, original code'],
    ['B', 'B — button + appearance-none (fix I shipped)'],
    ['F', 'F — button + min-height:0'],
    ['D', 'D — button + appearance-none + min-height:0'],
    ['E', 'E — D + max-height:16px'],
    ['G', 'G — button + appearance-none, empty (portrait case)']
  ];
  var cols = document.getElementById('cols');
  variants.forEach(function(v) {
    var w = document.createElement('div');
    w.className = 'colwrap';
    w.innerHTML = '<h2>' + v[1] + '</h2><div class="scroll" data-kind="' + v[0] + '">'
      + rowEl(v[0])
      + '<div class="wrap"><div class="card"></div>' + rowEl(v[0]) + '</div>'
      + '<div class="wrap"><div class="card b"></div>' + rowEl(v[0]) + '</div>'
      + '</div>';
    cols.appendChild(w);
  });

  function measure() {
    var lines = [];
    document.querySelectorAll('.scroll').forEach(function(sc) {
      var kind = sc.getAttribute('data-kind');
      var cards = sc.querySelectorAll('.card');
      var rows = sc.querySelectorAll('.row');
      var gap = Math.round((cards[1].getBoundingClientRect().top - cards[0].getBoundingClientRect().bottom) * 10) / 10;
      var rowH = [];
      rows.forEach(function(r) { rowH.push(Math.round(r.getBoundingClientRect().height * 10) / 10); });
      var cs = getComputedStyle(rows[1]);
      lines.push(kind + ': gap=' + gap + '  rowHeights=' + JSON.stringify(rowH) + '  appear=' + cs.webkitAppearance + ' minH=' + cs.minHeight);
    });
    document.getElementById('results').textContent = lines.join('\n');
  }
  window.addEventListener('load', function() { setTimeout(measure, 300); });
</script>
</body>
</html>
